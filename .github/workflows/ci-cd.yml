name: Ci-cd
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/back
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: "temurin"
          cache: "maven"

      - name: Install dependencies
        run: mvn clean install

      - name: Execute tests
        run: mvn clean test

      - name: Creation of the code coverage
        run: mvn jacoco:report

      - name: Generate code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: Jacoco code coverage
          path: ./back/target/site/jacoco/

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ github.workspace }}/front

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Install dependencies
        run: npm ci

      - name: Run Angular build
        run: npm run build --if-present
      
      - name: Run Angulal tests
        run: npm test -- --browsers=ChromeHeadless --watch=false --code-coverage

      
      - name: Generate code coverage report
        uses: actions/upload-artifact@v4
        with:
          name: Test code coverage
          path: ./front/coverage
          
  sonarqube-front:
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 16

      - name: Download coverage artefact
        uses: actions/download-artifact@v4
        with:
          name: Test code coverage
          path: front/coverage

      - name: SonarCloud front scan
        uses: SonarSource/sonarcloud-github-action@v2
        with:
          projectBaseDir: front
          args: >
            -Dsonar.projectKey=casspuisset_Gerez-un-projet-collaboratif-en-int-grant-une-demarche-CI-CD
            -Dsonar.organization=casspuissets0nark3y
            -Dsonar.javascript.lcov.reportPaths=coverage/sonar/lcov.info
            -Dsonar.typescript.lcov.reportPaths=coverage/sonar/lcov.info

        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}

  sonarqube-back:
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
        
      - name: Set up java
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: "maven"
          
      - name: Build back and generate coverage
        working-directory: back
        run: mvn clean verify
        
      - name: SonarCloud back scan
        uses: sonarsource/sonarcloud-github-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: back
          args: >
            -Dsonar.projectKey=casspuisset_Gerez-un-projet-collaboratif-en-int-grant-une-demarche-CI-CD
            -Dsonar.organization=casspuissets0nark3y
            -Dsonar.java.binaries=target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
